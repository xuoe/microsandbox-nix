name: Update microsandbox

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-microsandbox
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.versions.outputs.current }}
      latest: ${{ steps.versions.outputs.latest }}
      update: ${{ steps.versions.outputs.update }}

    steps:
      - uses: actions/checkout@v4

      - name: Compare current and latest versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(<version)
          latest=$(gh api repos/superradcompany/microsandbox/releases/latest --jq .tag_name)
          latest=${latest#v}

          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "could not determine current/latest version" >&2
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "$current" = "$latest" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "already at $current"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "updating $current -> $latest"
          fi

  update:
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Update version and checksums.json
        run: .github/scripts/update-version "${{ needs.check.outputs.latest }}"

      - name: Create release data patch
        run: |
          git diff --no-color --no-ext-diff > release-data.patch
          test -s release-data.patch

      - name: Upload release data
        uses: actions/upload-artifact@v4
        with:
          name: release-data
          path: release-data.patch

  validate:
    needs: [check, update]
    if: needs.check.outputs.update == 'true'
    uses: ./.github/workflows/check.yml
    with:
      release-data: release-data

  commit:
    needs: [check, update, validate]
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download release data
        uses: actions/download-artifact@v4
        with:
          name: release-data

      - name: Apply release data
        run: git apply release-data.patch

      - name: Commit
        env:
          VERSION: ${{ needs.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add version checksums.json README.md
          git commit -m "update: bump microsandbox to ${VERSION}"
          git tag -a "v${VERSION}" -m "microsandbox ${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"
