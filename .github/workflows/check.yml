name: Check microsandbox-nix 

on:
  push:
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      release-data:
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
        mode: [flake, classic]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Download release data
        if: inputs.release-data
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release-data }}

      - name: Apply release data
        if: inputs.release-data
        run: git apply release-data.patch

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: ${{ matrix.mode == 'classic' && 'experimental-features =' || '' }}
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Check flake entry points
        if: matrix.mode == 'flake'
        run: scripts/check-flake

      - name: Check flake and classic derivations match
        if: matrix.mode == 'flake'
        run: scripts/check-parity

      - name: Confirm flakes are disabled
        if: matrix.mode == 'classic'
        run: '! nix eval --expr 1 2>/dev/null'

      - name: Check classic entry points
        if: matrix.mode == 'classic'
        run: scripts/check-classic
